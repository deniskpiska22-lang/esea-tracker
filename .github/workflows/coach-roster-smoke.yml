name: Verify independent coach cache ingestion
on:
  push:
    branches: [esea-coach-roster-smoke]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9106fd4e053148f6f9ab2a75636398acdadd3d10
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/coach*.test.js tests/storedCoachLobby.test.js tests/recentTeamLineup.test.js
      - name: Import one batch from already saved match roles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
        run: node scripts/syncStoredCoachLobbies.js
