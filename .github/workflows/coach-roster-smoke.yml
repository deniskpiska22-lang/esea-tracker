name: Check ESEA active team endpoint
on:
  push:
    branches: [esea-coach-roster-smoke]
permissions:
  contents: read
jobs:
  roster:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect user-supplied public ESEA active team URL
        run: |
          node --input-type=module <<'JS'
          const url = 'https://www.faceit.com/api/team-leagues/v2/leagues/a14b8616-45b9-4581-8637-4dfd0b5f6af8/users/0871c9f5-cacc-460e-a44a-c85bb414ad5b/teams/active';
          const response = await fetch(url, { headers: { accept: 'application/json' }, signal: AbortSignal.timeout(15000) });
          console.log('HTTP', response.status, 'content-type', response.headers.get('content-type'));
          if (response.ok) {
            const data = await response.json();
            function publicFields(value, depth = 0) {
              if (depth > 10) return null;
              if (Array.isArray(value)) return value.slice(0,30).map(item => publicFields(item, depth+1));
              if (!value || typeof value !== 'object') return value;
              return Object.fromEntries(Object.entries(value).filter(([key]) => !/token|secret|email|phone|birth|credential|address|cookie/i.test(key))
                .map(([key,value]) => [key,publicFields(value,depth+1)]));
            }
            console.log(JSON.stringify(publicFields(data)));
          }
          JS
