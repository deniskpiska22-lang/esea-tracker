name: Process post-match stat jobs

on:
  # Schedule disabled — this backlog/queue processing now runs continuously
  # on Railway via scripts/statsWorker.js (dedicated service, ~45s cadence),
  # which doesn't suffer from GitHub Actions' cron drift (observed 1-2.5h
  # delays on this repo's free-tier schedule). Kept as a manual backup
  # (workflow_dispatch) rather than deleted, in case the Railway service is
  # ever down and a one-off manual catch-up run is needed.
  workflow_dispatch:

concurrency:
  group: process-stat-jobs
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill jobs for pre-existing unsynced matches
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: npm run stat-jobs:backfill

      - name: Claim and process due match_stat_jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
        run: npm run stat-jobs:process
