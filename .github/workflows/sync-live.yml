name: Refresh live FACEIT matches

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: refresh-live-matches
  cancel-in-progress: true

jobs:
  refresh-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh matches and collect finished-map stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          MATCH_SYNC_CONCURRENCY: 5
          LIVE_LOOKBACK_HOURS: 8
          LIVE_LOOKAHEAD_HOURS: 24
          MAP_STATS_BATCH_SIZE: 100
        run: npm run sync:live
