name: Discover FACEIT matches

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: discover-matches
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh teams from standings
        run: npm run v2:sync

      - name: Discover and sync matches
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          MATCH_SYNC_CONCURRENCY: 5
          DISCOVERY_DAYS_AHEAD: 7
          FINISHED_DAYS_BACK: 7
          LIVE_LOOKBACK_HOURS: 8
          LIVE_LOOKAHEAD_HOURS: 24
          RUN_WEEKLY_RATING_SNAPSHOT: "1"
          WEEKLY_RATING_SNAPSHOT_DAY_UTC: "1"
        run: npm run sync:auto
